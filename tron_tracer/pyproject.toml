[project]
name = "tron-tracer"
version = "0.1.0"
description = "Deterministic FIFO/LIFO fund tracing and attribution tool for the Tron blockchain"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "SQLAlchemy>=2.0",
    "networkx>=3.2",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tron-tracer = "tron_tracer.cli:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tron_tracer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
